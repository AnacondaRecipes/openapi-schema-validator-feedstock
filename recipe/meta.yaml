{% set name = "openapi-schema-validator" %}
{% set version = "0.9.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: b72db64315b89d21834cd3ffef37e3e6893bc876327be2d366e8424b1029afd3

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<38]

requirements:
  host:
    - pip
    - poetry-core
    - python
  run:
    - python
    - jsonschema >=4.19.1,<5.0.0
    - rfc3339-validator
    - jsonschema-specifications >=2024.10.1
    - referencing >=0.37.0,<0.38.0
    - pydantic >=2.0.0,<3.0.0
    - pydantic-settings >=2.0.0,<3.0.0
  run_constrained:
    - regress >=2025.10.1

test:
  source_files:
    - tests
  imports:
    - openapi_schema_validator
  commands:
    - pip check
    - pytest -vv tests
  requires:
    - pip
    - pytest

about:
  home: https://github.com/python-openapi/openapi-schema-validator
  summary: OpenAPI schema validation for Python
  description: |
    OpenAPI schema validation for Python
  doc_url: https://openapi-schema-validator.readthedocs.io
  dev_url: https://github.com/python-openapi/openapi-schema-validator
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD

extra:
  recipe-maintainers:
    - bollwyvl
